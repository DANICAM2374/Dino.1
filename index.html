<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dino Runner</title><style>body{margin:0;background:#f7f7f7;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:monospace;transition:.5s}body.dark{background:#080808}#gameContainer{width:min(900px,96vw);text-align:center}canvas{width:100%;height:auto;display:block;border:2px solid #111;border-radius:10px;background:#f7f7f7;touch-action:none;user-select:none}body.dark canvas{background:#080808;border-color:#fff}#info{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:13px;color:#555;flex-wrap:wrap}body.dark #info{color:#ccc}</style></head><body><div id="gameContainer"><canvas id="gameCanvas" width="900" height="350"></canvas><div id="info"><span id="status">ESPACIO / TOCA PARA EMPEZAR</span><span id="speedText">🌞 Velocidad 6.00</span></div></div><script>
const c=document.getElementById("gameCanvas"),x=c.getContext("2d"),st=document.getElementById("status"),sp=document.getElementById("speedText"),g=285;let a=null,run=false,over=false,score=0,hi=0,frame=0,last=0,timer=55,speed=6,obs=[];
const d={x:90,y:237,width:42,height:48,v:0,j:false,step:0};

function snd(f,t,type="square",v=.06){try{a=a||new(window.AudioContext||window.webkitAudioContext)();if(a.state==="suspended")a.resume();let o=a.createOscillator(),q=a.createGain();o.type=type;o.frequency.value=f;q.gain.value=v;o.connect(q);q.connect(a.destination);o.start();q.gain.exponentialRampToValueAtTime(.001,a.currentTime+t);o.stop(a.currentTime+t)}catch(e){}}
function ms(){snd(660,.07);setTimeout(()=>snd(880,.1),70)}

function reset(){score=0;frame=0;last=0;timer=55;speed=6;obs=[];run=true;over=false;d.y=g-d.height;d.v=0;d.j=false;d.step=0;document.body.classList.remove("dark");st.textContent="CORRE...";sp.textContent="🌞 Velocidad 6.00";snd(500,.06);requestAnimationFrame(loop)}

function jump(){if(!run||over){reset();return}if(!d.j){d.v=-13;d.j=true;snd(520,.065)}}

function spawn(){let hard=score>=500,z=c.width+20,r=Math.random();

if(!hard||r<.48){
 let n=Math.random()<.58?1:2;
 for(let i=0;i<n;i++){let b=Math.random()<.22;obs.push({type:"cactus",x:z,y:g-(b?52:38),width:b?25:20,height:b?52:38});z+=(b?30:25)+Math.random()*28}
}

if(hard){
 let dif=Math.min(1,(score-500)/1500),p=.35+dif*.35;

 if(Math.random()<p){
  let tipo=Math.random();
  if(tipo<.34){
   let by=130+Math.random()*15;
   obs.push({type:"bird",x:z+35,y:by,baseY:by,phase:Math.random()*6.28,width:44,height:24,flap:0});
  }else if(tipo<.68){
   let by=235+Math.random()*12;
   obs.push({type:"bird",x:z+35,y:by,baseY:by,phase:Math.random()*6.28,width:44,height:24,flap:0});
  }else{
   let high=130+Math.random()*12,low=235+Math.random()*10;
   obs.push({type:"bird",x:z+35,y:high,baseY:high,phase:Math.random()*6.28,width:44,height:24,flap:0});
   obs.push({type:"bird",x:z+105,y:low,baseY:low,phase:Math.random()*6.28,width:44,height:24,flap:0});
  }
 }

 if(score>=900&&Math.random()<.25+dif*.35){
  let by=Math.random()<.5?130+Math.random()*12:235+Math.random()*10;
  obs.push({type:"bird",x:z+150+Math.random()*60,y:by,baseY:by,phase:Math.random()*6.28,width:44,height:24,flap:0});
 }
}

timer=Math.max(30,Math.floor(82-speed*2+Math.random()*(hard?25:35)))}

function hit(a,b){let p=b.type=="bird"?5:4;return a.x+p<b.x+b.width-p&&a.x+a.width-p>b.x+p&&a.y+p<b.y+b.height-p&&a.y+a.height-p>b.y+p}

function update(){frame++;score+=.1;let m=Math.floor(score/100)*100;if(m>last){last=m;speed+=m>=500?.75:.5;ms();sp.textContent=(score>=500?"🌑 ":"🌞 ")+"Velocidad "+speed.toFixed(2)}

if(score>=500&&!document.body.classList.contains("dark")){document.body.classList.add("dark");sp.textContent="🌑 NOCHE · 🌵 + 🐦";snd(180,.16,"sawtooth",.07);setTimeout(()=>snd(110,.18,"sawtooth",.05),120)}

if(--timer<=0)spawn();

d.v+=.65;d.y+=d.v;if(d.y>=g-d.height){d.y=g-d.height;d.v=0;d.j=false}else d.j=true;if(!d.j)d.step++;

for(let o of obs){o.x-=speed;if(o.type=="bird"){o.flap++;o.phase+=.09;o.y=o.baseY+Math.sin(o.phase)*12}}

for(let o of obs)if(hit(d,o)){over=true;run=false;hi=Math.max(hi,Math.floor(score));st.textContent="💀 PERDISTE · TOCA PARA REINICIAR";snd(120,.32,"sawtooth",.08);return}

obs=obs.filter(o=>o.x+o.width>-30)}

function dino(){let X=d.x,Y=d.y,dark=document.body.classList.contains("dark");x.fillStyle=dark?"#fff":"#111";x.fillRect(X+9,Y+13,25,29);x.fillRect(X+27,Y+4,13,23);x.fillRect(X+36,Y+10,9,6);x.fillStyle=dark?"#080808":"#f7f7f7";x.fillRect(X+35,Y+8,3,3);x.fillStyle=dark?"#fff":"#111";x.fillRect(X,Y+21,10,7);let l=d.step%2;x.fillRect(X+12,Y+39,7,8+l*5);x.fillRect(X+27,Y+39,7,13-l*5)}

function bird(o){let dark=document.body.classList.contains("dark");x.fillStyle=dark?"#fff":"#111";x.fillRect(o.x+8,o.y+8,27,10);x.fillRect(o.x+30,o.y+3,12,12);let u=Math.floor(o.flap/7)%2==0;x.fillRect(o.x+3,o.y+(u?0:15),20,6);x.fillRect(o.x+34,o.y+(u?15:0),17,6);x.fillStyle=dark?"#080808":"#f7f7f7";x.fillRect(o.x+35,o.y+5,3,3)}

function draw(){let dark=document.body.classList.contains("dark");x.clearRect(0,0,c.width,c.height);x.fillStyle=dark?"#080808":"#f7f7f7";x.fillRect(0,0,c.width,c.height);x.strokeStyle=dark?"#fff":"#111";x.lineWidth=2;x.beginPath();x.moveTo(0,g+2);x.lineTo(c.width,g+2);x.stroke();x.fillStyle=dark?"#aaa":"#bbb";for(let i=0;i<c.width;i+=55)x.fillRect(i-(frame*speed)%55,g+13,24,2);

if(!dark){x.fillStyle="#d7d7d7";x.beginPath();x.arc(140,75,22,0,7);x.arc(165,75,28,0,7);x.arc(194,78,20,0,7);x.fill()}else{x.fillStyle="#ddd";x.beginPath();x.arc(760,62,27,0,7);x.fill();x.fillStyle="#080808";x.beginPath();x.arc(772,54,25,0,7);x.fill()}

for(let o of obs)if(o.type=="bird")bird(o);else{x.fillStyle=dark?"#fff":"#1f7a3a";x.fillRect(o.x,o.y,o.width,o.height);x.fillRect(o.x-7,o.y+12,9,6);x.fillRect(o.x+o.width-2,o.y+22,8,6)}

dino();x.fillStyle=dark?"#fff":"#111";x.font="bold 18px monospace";x.textAlign="right";x.fillText("HI "+hi+"   "+Math.floor(score),c.width-18,30);

if(!run&&!over&&!score){x.textAlign="center";x.font="bold 25px monospace";x.fillText("TOCA O PRESIONA ESPACIO",c.width/2,150);x.font="15px monospace";x.fillText("500 = 🌑 · 🐦 · Más velocidad y dificultad",c.width/2,180)}

if(over){x.fillStyle=dark?"#fff":"#111";x.textAlign="center";x.font="bold 30px monospace";x.fillText("GAME OVER",c.width/2,145);x.font="16px monospace";x.fillText("Puntos: "+Math.floor(score)+" · toca para volver a jugar",c.width/2,175)}}

function loop(){if(!run&&!over){draw();return}if(!over){update();draw();requestAnimationFrame(loop)}else draw()}

c.addEventListener("pointerdown",e=>{e.preventDefault();jump()},{passive:false});
document.addEventListener("keydown",e=>{if(e.code=="Space"||e.code=="ArrowUp"){e.preventDefault();jump()}});
draw();
</script></body></html>
