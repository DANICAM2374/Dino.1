<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dino Runner</title><style>body{margin:0;background:#f7f7f7;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:monospace;transition:.5s}body.dark{background:#080808}#gameContainer{width:min(900px,96vw);text-align:center}canvas{width:100%;height:auto;display:block;border:2px solid #111;border-radius:10px;background:#f7f7f7;touch-action:none;user-select:none}body.dark canvas{background:#080808;border-color:#fff}#info{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:#555}body.dark #info{color:#ccc}</style></head><body><div id="gameContainer"><canvas id="gameCanvas" width="900" height="350"></canvas><div id="info"><span id="status">ESPACIO / TOCA PARA EMPEZAR</span><span id="speedText">🌞 Velocidad 6.00</span></div></div><script>
const c=document.getElementById("gameCanvas"),x=c.getContext("2d"),st=document.getElementById("status"),sp=document.getElementById("speedText"),g=285;let a,run=0,over=0,score=0,hi=0,frame=0,last=0,timer=55,speed=6,obs=[];const d={x:90,y:237,width:42,height:48,v:0,j:0,step:0};

function snd(f,t,type="square",v=.06){try{a=a||new(window.AudioContext||window.webkitAudioContext);a.state=="suspended"&&a.resume();let o=a.createOscillator(),q=a.createGain();o.type=type;o.frequency.value=f;q.gain.value=v;o.connect(q);q.connect(a.destination);o.start();q.gain.exponentialRampToValueAtTime(.001,a.currentTime+t);o.stop(a.currentTime+t)}catch(e){}}
function ms(){snd(660,.07);setTimeout(()=>snd(880,.1),70)}
function reset(){score=0;frame=0;last=0;timer=55;speed=6;obs=[];run=1;over=0;d.y=g-d.height;d.v=0;d.j=0;d.step=0;document.body.classList.remove("dark");st.textContent="CORRE...";sp.textContent="🌞 Velocidad 6.00";snd(500,.06);requestAnimationFrame(loop)}
function jump(){if(!run||over)return reset();if(!d.j){d.v=-13;d.j=1;snd(520,.065)}}
function cactus(z){let b=Math.random()<.2;obs.push({type:"cactus",x:z,y:g-(b?52:38),width:b?25:20,height:b?52:38})}
function bird(z,low){let y=low?225+Math.random()*12:125+Math.random()*15;obs.push({type:"bird",x:z,y,baseY:y,phase:Math.random()*6.28,width:44,height:24,flap:0})}

function spawn(){let h=score>=500,z=c.width+40,r=Math.random(),dif=h?Math.min(1,(score-500)/2500):0;if(!h){let n=Math.random()<.72?1:2;for(let i=0;i<n;i++){cactus(z);z+=35+Math.random()*45}}else{if(r<.30){let n=Math.random()<.78-dif*.18?1:2;for(let i=0;i<n;i++){cactus(z);z+=40+Math.random()*55}}else if(r<.50)bird(z,0);else if(r<.68)bird(z,1);else if(r<.82){cactus(z);bird(z+180+Math.random()*90,Math.random()<.5)}else if(r<.92){bird(z,Math.random()<.5);cactus(z+180+Math.random()*100)}else{bird(z,0);bird(z+150+Math.random()*80,1)}if(score>=1500&&Math.random()<.22+dif*.2){z+=180+Math.random()*100;Math.random()<.5?cactus(z):bird(z,Math.random()<.5)}}timer=Math.max(30,Math.floor((score<500?48:42-dif*10)+Math.random()*(score<500?40:32-dif*8)))}

function hit(a,b){let p=b.type=="bird"?5:4;return a.x+p<b.x+b.width-p&&a.x+a.width-p>b.x+p&&a.y+p<b.y+b.height-p&&a.y+a.height-p>b.y+p}
function update(){frame++;score+=.1;let m=Math.floor(score/100)*100;if(m>last){last=m;speed+=m>=500?.75:.5;ms();sp.textContent=(score>=500?"🌑 ":"🌞 ")+"Velocidad "+speed.toFixed(2)}if(score>=500&&!document.body.classList.contains("dark")){document.body.classList.add("dark");sp.textContent="🌑 NOCHE · 🌵 + 🐦";snd(180,.16,"sawtooth",.07);setTimeout(()=>snd(110,.18,"sawtooth",.05),120)}if(--timer<=0)spawn();d.v+=.65;d.y+=d.v;if(d.y>=g-d.height){d.y=g-d.height;d.v=0;d.j=0}else d.j=1;if(!d.j)d.step++;for(let o of obs){o.x-=speed;if(o.type=="bird"){o.flap++;o.phase+=.09;o.y=o.baseY+Math.sin(o.phase)*12}}for(let o of obs)if(hit(d,o)){over=1;run=0;hi=Math.max(hi,Math.floor(score));st.textContent="💀 PERDISTE · TOCA PARA REINICIAR";snd(120,.32,"sawtooth",.08);return}obs=obs.filter(o=>o.x+o.width>-30)}

function dino(){let X=d.x,Y=d.y,k=document.body.classList.contains("dark");x.fillStyle=k?"#fff":"#111";x.fillRect(X+9,Y+13,25,29);x.fillRect(X+27,Y+4,13,23);x.fillRect(X+36,Y+10,9,6);x.fillStyle=k?"#080808":"#f7f7f7";x.fillRect(X+35,Y+8,3,3);x.fillStyle=k?"#fff":"#111";x.fillRect(X,Y+21,10,7);let l=d.step%2;x.fillRect(X+12,Y+39,7,8+l*5);x.fillRect(X+27,Y+39,7,13-l*5)}
function bird(o){let k=document.body.classList.contains("dark");x.fillStyle=k?"#fff":"#111";x.fillRect(o.x+8,o.y+8,27,10);x.fillRect(o.x+30,o.y+3,12,12);let u=Math.floor(o.flap/7)%2==0;x.fillRect(o.x+3,o.y+(u?0:15),20,6);x.fillRect(o.x+34,o.y+(u?15:0),17,6);x.fillStyle=k?"#080808":"#f7f7f7";x.fillRect(o.x+35,o.y+5,3,3)}

function draw(){let k=document.body.classList.contains("dark");x.clearRect(0,0,c.width,c.height);x.fillStyle=k?"#080808":"#f7f7f7";x.fillRect(0,0,c.width,c.height);x.strokeStyle=k?"#fff":"#111";x.beginPath();x.moveTo(0,g+2);x.lineTo(c.width,g+2);x.stroke();x.fillStyle=k?"#aaa":"#bbb";for(let i=0;i<c.width;i+=55)x.fillRect(i-(frame*speed)%55,g+13,24,2);if(!k){x.fillStyle="#d7d7d7";x.beginPath();x.arc(140,75,22,0,7);x.arc(165,75,28,0,7);x.arc(194,78,20,0,7);x.fill()}else{x.fillStyle="#ddd";x.beginPath();x.arc(760,62,27,0,7);x.fill();x.fillStyle="#080808";x.beginPath();x.arc(772,54,25,0,7);x.fill()}for(let o of obs)if(o.type=="bird")bird(o);else{x.fillStyle=k?"#fff":"#1f7a3a";x.fillRect(o.x,o.y,o.width,o.height);x.fillRect(o.x-7,o.y+12,9,6);x.fillRect(o.x+o.width-2,o.y+22,8,6)}dino();x.fillStyle=k?"#fff":"#111";x.font="bold 18px monospace";x.textAlign="right";x.fillText("HI "+hi+"   "+Math.floor(score),c.width-18,30);if(!run&&!over&&!score){x.textAlign="center";x.font="bold 25px monospace";x.fillText("TOCA O PRESIONA ESPACIO",c.width/2,150);x.font="15px monospace";x.fillText("500 = 🌑 · 🐦 · Más velocidad y dificultad",c.width/2,180)}if(over){x.fillStyle=k?"#fff":"#111";x.textAlign="center";x.font="bold 30px monospace";x.fillText("GAME OVER",c.width/2,145);x.font="16px monospace";x.fillText("Puntos: "+Math.floor(score)+" · toca para volver a jugar",c.width/2,175)}}
function loop(){if(!run&&!over)return draw();if(!over){update();draw();requestAnimationFrame(loop)}else draw()}
c.addEventListener("pointerdown",e=>{e.preventDefault();jump()},{passive:false});document.addEventListener("keydown",e=>{if(e.code=="Space"||e.code=="ArrowUp"){e.preventDefault();jump()}});draw();
</script></body></html>
